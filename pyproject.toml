[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "0.1.0"
description = "Reusable grid-maze generation and shortest-path solving."
readme = "mazegen/README.md"
requires-python = ">=3.10"
authors = [{ name = "Jan Hauck" }, { name = "Tobias Kern" }]

[tool.setuptools.packages.find]
include = ["mazegen*"]

[tool.setuptools.package-data]
mazegen = ["README.md"]

[dependency-groups]
dev = ["build>=1.2.2", "flake8>=7.0", "mypy>=1.13"]
